name: E2E

on:
  workflow_call:
    inputs:
      soft-fail-secondary:
        description: 'Report IE11 and Next.js failures without failing the workflow.'
        type: boolean
        default: false
  workflow_dispatch:
  schedule:
    # Weekdays at 21:00 UTC
    - cron: '0 21 * * 1-5'

permissions:
  contents: read

jobs:
  e2e-tests-playwright:
    name: e2e tests playwright
    needs: examples
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Download build outputs
        uses: actions/download-artifact@v8
        with:
          name: e2e-build-outputs

      - name: Download examples
        uses: actions/download-artifact@v8
        with:
          name: e2e-examples

      - name: Unpack artifacts
        run: |
          tar -xf build-outputs.tar && rm build-outputs.tar
          tar -xf examples.tar && rm examples.tar

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: End-to-end tests (Playwright)
        run: yarn run test:e2e:playwright

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/e2e/playwright/playwright-report/
          retention-days: 7
          overwrite: true

      - name: Notify Slack
        if: failure()
        uses: slackapi/slack-github-action@v4
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_ACCESS_TOKEN }}
          payload: |
            {
              "channel": "${{ vars.SLACK_E2E_NOTIF_CHANNEL }}",
              "text": ":warning: End-to-end tests failed",
              "blocks": [
                {
                  "type": "header",
                  "text": {
                    "type": "plain_text",
                    "text": ":warning: End-to-end tests failed",
                    "emoji": true
                  }
                },
                {
                  "type": "section",
                  "fields": [
                    {
                      "type": "mrkdwn",
                      "text": "*Project*: ${{ github.repository }}"
                    },
                    {
                      "type": "mrkdwn",
                      "text": "*Framework*: Playwright"
                    }
                  ]
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "GitHub Actions"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }

