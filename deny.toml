# cargo-deny: advisories, licences, duplicate crates, sources.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  # Boost Software License: permissive, of the xxhash-rust crate used for body hashing.
  "BSL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Unpublished path dependencies inside this workspace carry no version; that is a
# wildcard by cargo-deny's reckoning and harmless here, since publish = false.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
