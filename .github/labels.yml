# Repository labels. scripts/public/settings.sh creates and updates them on GitHub.
# Use a rule label alongside the issue type, including false-positive for wrong findings.
# Rule names come from crates/spirolo-rules/src; colors follow the Spirolo brand palette.

- name: "bug"
  color: "F5A524"
  description: "A crash, incorrect behavior, or broken installation."
- name: "enhancement"
  color: "D7B2F5"
  description: "A request for new or changed behavior."
- name: "false-positive"
  color: "F5A524"
  description: "A finding that is wrong about the reported test suite."
- name: "docs"
  color: "BBA2CD"
  description: "Documentation corrections and examples."
- name: "good first issue"
  color: "704292"
  description: "A small task with a clear starting point and acceptance criteria."
- name: "help wanted"
  color: "D7B2F5"
  description: "Contributions welcome; the task may need investigation."
