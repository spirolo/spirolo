name: mutants
permissions:
  contents: read
on:
  schedule: [{ cron: "0 3 * * 1" }]
  workflow_dispatch:
    inputs:
      crate:
        description: "One crate to mutate, for example spirolo-inputs. Empty runs every crate."
        type: string
        default: ""
# One mutation run at a time: the shard cap below holds per run, so a later run waits for
# the first to end instead of doubling the job slots taken. `queue: max` keeps every waiting
# run; by default a newer run cancels the one already waiting.
concurrency:
  group: mutants
  cancel-in-progress: false
  queue: max
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22" }
      - id: plan
        run: node scripts/public/mutants.mjs plan >> "$GITHUB_OUTPUT"
        env:
          CRATE: ${{ inputs.crate }}
  mutants:
    name: ${{ matrix.crate }} ${{ matrix.shard }}/${{ matrix.shards }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      # Half of the 20 jobs the account may run at once, so a pull request's checks start
      # while a full run is going. A full run is about 2,540 runner minutes: over four hours.
      max-parallel: 10
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The version rust-toolchain.toml names, the one the required check uses.
      - run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22" }
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with: { tool: "cargo-mutants, cargo-nextest" }
      # The baseline. cargo-mutants' own baseline runs only the mutated crate's tests, even
      # with --test-workspace=true, so the suite every mutant is judged by is proven here.
      - run: cargo nextest run --workspace
      # In place, so each mutant is built and tested in the tree the baseline just passed in.
      # A mutant counts as missed only when no test in the workspace catches it.
      - run: >-
          node scripts/public/mutants.mjs run "$CRATE $SHARD/$SHARDS" --
          cargo mutants --in-place --baseline=skip --timeout 120
          --package "$CRATE" --shard "$SHARD/$SHARDS"
          --test-tool nextest --test-workspace=true --cargo-test-arg=--fail-fast
        timeout-minutes: 300
        env:
          CRATE: ${{ matrix.crate }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.shards }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutants-${{ matrix.crate }}-${{ matrix.shard }}-of-${{ matrix.shards }}
          path: mutants.out
  # One row per crate, summed over its shards. It runs when a shard failed too, and then
  # shows that crate as incomplete instead of summing fewer shards as if they were all.
  totals:
    needs: mutants
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: "22" }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { pattern: "mutants-*", path: shards }
      - run: node scripts/public/mutants.mjs totals shards
        env:
          CRATE: ${{ inputs.crate }}
