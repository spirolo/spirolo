name: website
permissions:
  contents: read
# Only the site and what its build reads (scripts/sync.mjs): Rust changes never build it,
# and site changes never wait on cargo. Not a required check, so skipping it blocks nothing.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'branding/**'
      - 'corpus/rule-status.json'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'branding/**'
      - 'corpus/rule-status.json'
      - '.github/workflows/website.yml'
jobs:
  build:
    name: website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with: { version: '8.15.5' }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: '22' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:public
      - run: pnpm types:check
      - run: pnpm build
