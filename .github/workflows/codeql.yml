name: codeql
permissions:
  contents: read
on:
  push: { branches: [main] }
  pull_request:
  schedule:
    - cron: '27 4 * * 1'
jobs:
  analyze:
    name: codeql (${{ matrix.language }})
    # Code scanning needs Advanced Security on a private repo: run on the public one only.
    if: github.repository == 'spirolo/spirolo'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [actions, javascript-typescript, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
